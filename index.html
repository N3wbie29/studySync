<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>studySync — Calendar</title>
  <style>
    :root{--bg:#f7f8fb;--card:#fff;--accent:#2b6ef6;--muted:#6b7280}
    body{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#111;margin:0;padding:32px;}
    .container{max-width:900px;margin:0 auto}
    .card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 6px 18px rgba(16,24,40,0.06)}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-size:20px;margin:0}
    .today-info{display:flex;gap:16px;align-items:center}
    .pill{background:linear-gradient(90deg,rgba(43,110,246,0.08),rgba(43,110,246,0.02));color:var(--accent);padding:10px 14px;border-radius:999px;font-weight:600}
    .muted{color:var(--muted);font-size:14px}
    .calendar{display:grid;grid-template-columns:1fr 320px;gap:18px}
    .month{padding:14px;border-radius:10px;background:linear-gradient(180deg,#fff,#fbfdff)}
    .month h2{margin:0 0 8px 0;font-size:16px}
    table.calendar-table{width:100%;border-collapse:collapse}
    table.calendar-table th{color:var(--muted);font-weight:600;padding:8px 6px;text-align:center}
    table.calendar-table td{height:64px;text-align:right;padding:6px;border-radius:8px;vertical-align:top}
    td.empty{opacity:0.25}
    td.today{background:var(--accent);color:#fff;font-weight:700}
    .sidebar{padding:14px;border-radius:10px;background:#fff}
    .sidebar h3{margin:0 0 8px 0}
    .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eef2ff}
    .week-number{font-size:32px;font-weight:700;color:var(--accent)}
    @media (max-width:820px){.calendar{grid-template-columns:1fr;}.sidebar{order:2}}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <header>
        <h1>studySync — Calendar</h1>
        <div class="today-info">
          <div id="iso-week" class="pill">Week —</div>
          <div class="muted" id="today-date">Loading...</div>
        </div>
      </header>

      <div class="calendar">
        <div class="month" id="month-view">
          <h2 id="month-name">Month</h2>
          <table class="calendar-table" id="calendar-table">
            <thead>
              <tr>
                <th>Mon</th>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
                <th>Sat</th>
                <th>Sun</th>
              </tr>
            </thead>
            <tbody id="calendar-body">
              <!-- calendar generated by JS -->
            </tbody>
          </table>
        </div>

        <aside class="sidebar">
          <h3>Today</h3>
          <div class="info-row"><div class="muted">Date</div><div id="info-date">—</div></div>
          <div class="info-row"><div class="muted">Day</div><div id="info-day">—</div></div>
          <div class="info-row"><div class="muted">ISO Week</div><div id="info-week">—</div></div>
          <div style="height:12px"></div>
          <div class="muted">Tip: This shows the ISO week number (weeks start on Monday).</div>
        </aside>
      </div>
    </div>
  </div>

  <script>
    // Helper: get ISO week number for a date
    function getISOWeekNumber(date) {
      // Copy date and set to UTC to avoid timezone issues
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      // ISO week starts on Monday. Get day number (1 = Monday, 7 = Sunday)
      const dayNum = d.getUTCDay() === 0 ? 7 : d.getUTCDay();
      // Set to nearest Thursday: current date + 4 - dayNum
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
      return weekNo;
    }

    function formatDate(d) {
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function getDayName(d) {
      return d.toLocaleDateString(undefined, { weekday: 'long' });
    }

    function renderTodayInfo() {
      const now = new Date();
      const week = getISOWeekNumber(now);
      document.getElementById('iso-week').textContent = 'Week ' + week;
      document.getElementById('today-date').textContent = formatDate(now) + ' · ' + getDayName(now);
      document.getElementById('info-date').textContent = formatDate(now);
      document.getElementById('info-day').textContent = getDayName(now);
      document.getElementById('info-week').textContent = week;
    }

    function renderMonthCalendar(year, month) {
      // month: 0-11
      const monthName = new Date(year, month, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
      document.getElementById('month-name').textContent = monthName;
      const tbody = document.getElementById('calendar-body');
      tbody.innerHTML = '';

      // ISO week columns: Monday ... Sunday
      // Find first day to show: the Monday on or before the 1st of the month
      const firstOfMonth = new Date(year, month, 1);
      const firstDay = firstOfMonth.getDay() === 0 ? 7 : firstOfMonth.getDay(); // 1..7
      // number of days in month
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let current = new Date(year, month, 1 - (firstDay - 1)); // start from Monday

      while (true) {
        const tr = document.createElement('tr');
        let done = true;
        for (let i = 0; i < 7; i++) {
          const td = document.createElement('td');
          if (current.getMonth() !== month) {
            td.classList.add('empty');
            td.textContent = current.getDate();
          } else {
            td.textContent = current.getDate();
            // mark today
            const today = new Date();
            if (current.getFullYear() === today.getFullYear() && current.getMonth() === today.getMonth() && current.getDate() === today.getDate()) {
              td.classList.add('today');
            }
            done = false;
          }
          tr.appendChild(td);
          current.setDate(current.getDate() + 1);
        }
        tbody.appendChild(tr);
        if (current.getMonth() > month || (current.getMonth() === 0 && month === 11)) break;
      }
    }

    // Initialize
    (function init() {
      renderTodayInfo();
      const now = new Date();
      renderMonthCalendar(now.getFullYear(), now.getMonth());
    })();

    // Optional: update at midnight
    const msUntilMidnight = (function() {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
      return next - now;
    })();
    setTimeout(function() {
      renderTodayInfo();
      const now = new Date();
      renderMonthCalendar(now.getFullYear(), now.getMonth());
      // set recurring update every 24h after that
      setInterval(() => { renderTodayInfo(); renderMonthCalendar(new Date().getFullYear(), new Date().getMonth()); }, 24*60*60*1000);
    }, msUntilMidnight + 1000);
  </script>
</body>
</html>
